name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash scripts/test.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package website
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r css js dist/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
